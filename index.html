<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <!-- ESTILOS PRÓPRIOS -->
    <link rel="stylesheet" href="src/styles.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <title>SISTEMA DE CADASTRO DE CANDIDATOS</title>
  </head>
  <body class="p-2">

    <div class="container bg-white mt-5 p-4">
      <div class="main">

        <h3>Lista de candidatos</h3>
  
        <div class="row">
          <div class="col-10">
            <input id="search" type="text" class="w-100 form-control" placeholder="Buscar..."/>
          </div>
  
          <div class="col-2">
            <button type="button" class="w-100 border-none btn btn-primary p-1 botao-candidato" onclick="abrirModal()">Novo Candidato</button>
          </div>
        </div>
  
        <table id="candidatos" class="w-100">
          <thead class="border-0 border-bottom border-2 border-secondary">
            <tr>
              <td>CPF</td>
              <td>Nome</td>
              <td>Celular</td>
              <td>E-mail</td>
              <td>Sexo</td>
              <td>Data Nascimento</td>
              <td>Habilidades</td>
              <td>Editar</td>
              <td>Remover</td>
            </tr>
          </thead>
  
          <tbody id="table-body">
  
          </tbody>
        </table>
      </div>
    </div>


    <!-- Modal -->
    <div class="modal fade" id="candidatoModal" tabindex="-1" aria-labelledby="candidatoModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="candidatoModalLabel">Candidato</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          
          <form action="" class="needs-validation">
            <div class="modal-body">
              <div class="row mb-3">
                <input type="hidden" id="id"/>
                <div class="col-md-4 form-floating">
                  <input type="text" class="form-control" id="cpf" placeholder="CPF" required/>
                  <label for="cpf" class="ms-2">CPF</label>
                </div>

                <div class="col-md-8 form-floating">
                  <input type="text" class="form-control" id="nome" placeholder="Nome" required/>
                  <label for="nome" class="ms-2">Nome</label>
                </div>

                <div class="col-md-4 form-floating">
                  <input type="text" class="form-control" id="celular" placeholder="Celular" required/>
                  <label for="celular" class="ms-2">Celular</label>
                </div>

                <div class="col-md-4 form-floating">
                  <input type="email" class="form-control" id="email" placeholder="E-mail" required/>
                  <label for="email" class="ms-2">E-mail</label>
                </div>
            
                <div class="col-md-4 form-floating">
                  <input type="date" class="form-control" id="nascimento" placeholder="Data Nascimento" required/>
                  <label for="nascimento" class="ms-2">Data Nascimento</label>
                </div>
              </div>

              <div class="row">
                <div class="col-md-4">
                  <label class="form-label fw-bolder">Sexo</label>
                  <div class="col">
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="sexo" id="sexoMasculino" checked>
                      <label class="form-check-label" for="sexoMasculino">Masculino</label>
                    </div>

                    <div class="form-check ">
                      <input class="form-check-input" type="radio" name="sexo" id="sexoFeminino">
                      <label class="form-check-label" for="sexoFeminino">Feminino</label>
                    </div>
                  </div>
                </div>

                <div class="col-md-4">
                  <label class="form-label fw-bolder">Habilidades</label>
                  <div class="row">
                    <div class="col-md-4">
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="skillHtml">
                        <label class="form-check-label" for="skillHtml">HTML</label>
                      </div>

                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="skillCss">
                        <label class="form-check-label" for="skillCss">CSS</label>
                      </div>

                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="skillJs">
                        <label class="form-check-label" for="skillJs">JS</label>
                      </div>
                    </div>

                    <div class="col-md-4">
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="skillBoot">
                        <label class="form-check-label" for="skillBoot">Bootstrap</label>
                      </div>

                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="skillNode">
                        <label class="form-check-label" for="skillNode">Node.js</label>
                      </div>

                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="skillReact">
                        <label class="form-check-label" for="skillReact">React</label>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            
            <div class="modal-footer">
              <button type="submit" class="btn btn-success" onclick="salvar()"><i class="fa-solid fa-floppy-disk me-1" style="color: #fff;"></i>Salvar</button>
              <button type="button" class="btn btn-secondary" onclick="fecharModal()"><i class="fa-solid fa-xmark me-1" style="color: #fff; font-size: 1.15rem; vertical-align: middle;"></i>Fechar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- JQUERY -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    
    <!-- BOOTSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js" integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB" crossorigin="anonymous"></script>
    
    <script src="src/script.js"></script>
  </body>
</html>
